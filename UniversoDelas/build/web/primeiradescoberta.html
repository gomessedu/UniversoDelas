<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Primeira Descoberta - Universo Delas</title>

    <link rel="stylesheet" href="css/Estilo.css">
</head>

<body>

    <main class="primeira-descoberta">

        <section class="descoberta-conteudo">

            <p class="descoberta-pequeno">
                UNIVERSO DELAS
            </p>

            <h1>
                PRIMEIRA DESCOBERTA
            </h1>

            <div class="linha"></div>

            <p class="descoberta-texto">
                Toda grande descoberta começa com uma pergunta.
            </p>

            <p class="descoberta-texto">
                E talvez você ainda não saiba, mas existem histórias
                de mulheres que mudaram a ciência e que por muito tempo
                não receberam o reconhecimento que mereciam.
            </p>

            <p class="descoberta-destaque">
                Agora, sua jornada começa.
            </p>

            <button class="botao-redondo" onclick="continuar()">
                →
            </button>

            <p class="clique">
                CLIQUE PARA CONTINUAR
            </p>
            

        </section>

    </main>

    <script>
        function continuar() {
            window.location.href = "abertura.html";
        }
    </script>

</body>

</html>
